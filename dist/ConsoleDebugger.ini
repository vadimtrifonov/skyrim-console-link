;----------------------------------------------------------------------------------------------
; ConsoleDebugger configuration file


;----------------------------------------------------------------------------------------------
; Primary console feature toggles
[Main]

; Mirror accepted console input into the ConsoleDebugger log (default: true)
EnableConsoleInputLogging = true

; Mirror engine console output into the ConsoleDebugger log (default: true)
EnableConsoleOutputLogging = true

; Allow plugin-authored lines to be written back into the in-game console (default: true)
EnableConsoleWriteBack = true


;----------------------------------------------------------------------------------------------
; Logging
[Logging]

; Mirror console activity into a dedicated console log in addition to the main plugin log (default: true)
MirrorToSeparateConsoleLog = true

; Include timestamps in mirrored console records (default: true)
IncludeTimestamps = true


;----------------------------------------------------------------------------------------------
; Write-back
[WriteBack]

; File watched by the plugin for agent-authored console lines.
; Relative paths resolve under the standard SKSE log directory.
; Default: ConsoleDebugger.outbox.txt
OutboxPath = ConsoleDebugger.outbox.txt

; Upper bound on the number of unread outbox lines processed per tick (default: 8)
MaxLinesPerTick = 8


;----------------------------------------------------------------------------------------------
; Debug tracing
[Debug]

; Logs detailed runtime hook installation decisions (default: false)
TraceHookInstall = false
