;----------------------------------------------------------------------------------------------
; ConsoleLink configuration file


;----------------------------------------------------------------------------------------------
; Primary console feature toggles
[Main]

; Mirror accepted console input into the ConsoleLink log (default: true)
EnableConsoleInputLogging = true

; Mirror engine console output into the ConsoleLink log (default: true)
EnableConsoleOutputLogging = true

; Allow plugin-authored lines to be printed in the in-game console without executing them (default: true)
EnableConsolePrint = true

; Allow agent-authored lines to be submitted as real console commands through the validated VR ExecuteCommand path (default: true)
EnableConsoleCommandSubmission = true


;----------------------------------------------------------------------------------------------
; Logging
[Logging]

; Include timestamps in mirrored console records (default: true)
IncludeTimestamps = true


;----------------------------------------------------------------------------------------------
; Print
[Print]

; File watched by the plugin for agent-authored console print lines.
; Relative paths resolve under the standard SKSE log directory.
; Default: ConsoleLink.outbox.txt
OutboxPath = ConsoleLink.outbox.txt

; Upper bound on the number of unread print lines processed per tick (default: 8)
MaxLinesPerTick = 8


;----------------------------------------------------------------------------------------------
; Command submission
[CommandSubmission]

; File watched by the plugin for agent-authored console commands.
; Relative paths resolve under the standard SKSE log directory.
; Default: ConsoleLink.inbox.txt
InboxPath = ConsoleLink.inbox.txt

; Upper bound on the number of unread command lines processed per tick (default: 4)
MaxCommandsPerTick = 4

