schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
rules:
  design:
    - MUST specify high signal, critical descisoins and assumptions only
    - SHOULD not invent Risks / Trade-offs, Migration Plan, Open Questions if not absolutely necessary.
  tasks:
    - MUST be change completion ledger.
    - MUST structure tasks around Implemented, Verified, and Deferred.
    - MUST put build, test, and live-validation evidence under Verified.
    - MUST put known carry-forward items intentionally left for later under Deferred.
