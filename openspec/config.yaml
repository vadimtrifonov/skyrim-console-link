schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
rules:
  tasks:
    - Use tasks as the change completion ledger.
    - Structure tasks around Implemented, Verified, and Deferred.
    - Prefer completed-state checkpoints over forward coding instructions.
    - Put build, test, and live-validation evidence under Verified.
    - Put known carry-forward items intentionally left for later under Deferred.
